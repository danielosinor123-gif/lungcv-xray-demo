<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chest X-Ray Classification</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; color: #1e293b; }
  h1 { font-size: 1.5rem; }
  .disclaimer { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 0.75rem 1rem; border-radius: 4px; font-weight: 500; }
  .card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.25rem; margin-top: 1rem; }
  #preview { border: 1px solid #cbd5e1; border-radius: 6px; display: block; margin-top: 1rem; max-width: 100%; }
  #status { color: #64748b; margin-top: 0.5rem; }
  .bar-row { display: flex; align-items: center; margin-top: 0.5rem; gap: 0.5rem; }
  .bar-label { width: 110px; font-weight: 600; }
  .bar-track { flex: 1; background: #e2e8f0; border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: #3b82f6; transition: width 0.4s; }
  .bar-val { width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
  button { background: #3b82f6; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  button:disabled { background: #94a3b8; cursor: wait; }
</style>
</head>
<body>
<h1>Chest X-Ray Classification</h1>
<div class="disclaimer">Research prototype only. This output is not a medical diagnosis.</div>

<div class="card">
  <label for="file"><strong>Upload a chest X-ray</strong> (png / jpg)</label><br>
  <input type="file" id="file" accept="image/png,image/jpeg">
  <img id="preview" width="224" height="224" style="display:none">
  <div id="status">Loading model (~14 MB, one-time)...</div>
  <button id="btn" disabled>Predict</button>
  <div id="result"></div>
</div>

<script>
const CLASSES = ["NORMAL", "PNEUMONIA"];
const SIZE = 224;
let session = null;

const file = document.getElementById('file');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const btn = document.getElementById('btn');
const result = document.getElementById('result');

async function loadModel() {
  try {
    session = await ort.InferenceSession.create('model.onnx', { executionProviders: ['wasm'] });
    status.textContent = 'Model ready. Upload a chest X-ray and press Predict.';
    btn.disabled = false;
  } catch (e) {
    status.textContent = 'Model file not found yet (model.onnx) - it has not been added to this site.';
  }
}

file.onchange = () => {
  const f = file.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    preview.src = URL.createObjectURL(f);
    preview.style.display = 'block';
    status.textContent = 'Image loaded - press Predict.';
  };
  img.src = URL.createObjectURL(f);
};

btn.onclick = async () => {
  if (!session) return;
  btn.disabled = true;
  result.innerHTML = '';
  status.textContent = 'Running inference...';
  const ctx = document.createElement('canvas');
  ctx.width = SIZE; ctx.height = SIZE;
  const c2 = ctx.getContext('2d');
  const _cw = preview.naturalWidth || preview.width;
  const _ch = preview.naturalHeight || preview.height;
  const _m = Math.round(Math.min(_cw, _ch) * 0.04);
  c2.drawImage(preview, _m, _m, _cw - 2 * _m, _ch - 2 * _m, 0, 0, SIZE, SIZE);
  const data = c2.getImageData(0, 0, SIZE, SIZE).data;
  const floats = new Float32Array(SIZE * SIZE * 3);
  for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
    floats[j] = data[i];
    floats[j + 1] = data[i + 1];
    floats[j + 2] = data[i + 2];
  }
  const feeds = {};
  feeds[session.inputNames[0]] = new ort.Tensor('float32', floats, [1, SIZE, SIZE, 3]);
  const out = await session.run(feeds);
  const probs = Object.values(out)[0].data;
  let best = 0;
  for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
  const html = '<p><strong>Prediction: ' + CLASSES[best] + '</strong></p>';
  for (let i = 0; i < CLASSES.length; i++) {
    html += '<div class="bar-row"><div class="bar-label">' + CLASSES[i] + '</div><div class="bar-track"><div class="bar-fill" style="width:' + (probs[i] * 100).toFixed(1) + '%"></div></div><div class="bar-val">' + (probs[i] * 100).toFixed(1) + '%</div></div>';
  }
  result.innerHTML = html;
  status.textContent = 'Done.';
  btn.disabled = false;
};

loadModel();
</script>
</body>
</html>
